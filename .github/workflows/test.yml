name: test

on:
  push:
    branches-ignore:
      - "main"
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build-hugo-test:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo CLI
        run: sudo snap install hugo
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: test
        run: make 20-build-hugo-vserver-test
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: hugo-test-site
          path: ./public

  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: make 99-install-ansible-dependencies
      - name: Ansible lint
        run: make 04-ansible-lint
        continue-on-error: true

  vserver-test:
    needs:
      - ansible-lint
      - build-hugo-test
    runs-on: ubuntu-latest
    environment:
      name: test
      url: https://test.feuerwehr-kronshagen.de/${{ github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: make 99-install-ansible-dependencies
      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: hugo-test-site
          path: ./public
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.VSERVER_SSHKEY }}" > ~/.ssh/id_ed25519
          sudo chmod 600  ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VSERVER_HOST }} >> ~/.ssh/known_hosts
      - name: Ansible deployment
        run: >
          ansible-playbook
          -i "${{ secrets.VSERVER_HOST }},"
          --tags "deployment"
          --user "${{ secrets.VSERVER_SSHUSER }}"
          --private-key ~/.ssh/id_ed25519
          ansible/playbooks/21-webserver-upload.yml
      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f ~/.ssh/id_ed25519*
          rm -f ~/.ssh/password.txt

  # Issue #4: Lighthouse prüft die gerade bereitgestellte Testumgebung (gleicher NGINX wie Produktion).
  # Schwellenwerte stehen in lighthouserc.json, geprüfte Seiten im makefile (LIGHTHOUSE_PATHS).
  lighthouse:
    needs:
      - vserver-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Run Lighthouse CI
        run: make 21-lighthouse-vserver-test
      - name: Write job summary
        if: always()
        run: |
          manifest=.lighthouseci/reports/manifest.json
          [[ -f "$manifest" ]] || exit 0
          {
            echo "## Lighthouse (Median aus 3 Läufen)"
            echo
            echo "| Seite | Performance | Barrierefreiheit | Best Practices | SEO |"
            echo "|---|---|---|---|---|"
            jq -r '.[] | select(.isRepresentativeRun)
              | "| \(.url) | \(.summary | [.performance, .accessibility, ."best-practices", .seo]
              | map(. * 100 | round | tostring) | join(" | ")) |"' "$manifest"
            echo
            echo "SEO ist auf der Testumgebung durch \`noindex\` immer reduziert und wird nicht bewertet."
            echo "Vollständige Berichte: Artefakt \`lighthouse-reports\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          if-no-files-found: ignore

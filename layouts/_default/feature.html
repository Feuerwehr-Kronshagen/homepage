{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
{{ $posts := where site.Pages "Section" "posts" }}
{{ range $posts }}
<h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
{{ end }}
<hr>
{{ range hugo.Data }}
<h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
{{ end }}
{{ end }}

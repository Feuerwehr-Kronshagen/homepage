{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
{{ $category := .Params.filter_by }}
{{ $posts := where site.Pages "Section" "posts" }}
{{ $posts = where $posts "Params.categories" "intersect" (slice $category) }}
{{ range $posts }}
<a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
{{ end }}
{{ end }}
